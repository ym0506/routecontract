name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sbom:
    name: Java 17 / MySQL integration / SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate and configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: disabled
          validate-wrappers: true

      - name: Test fail-closed contest packaging rules
        run: |
          python3 -m unittest discover -s submission/tools/tests -v
          python3 -m unittest discover -s scripts/tests -v

      - name: Test, assemble artifacts, and generate verified CycloneDX SBOM
        run: ./gradlew --no-daemon --no-build-cache clean check assemble prepareVerifiedSbom

      - name: Verify same-checkout Maven publication consumer
        run: ./scripts/verify-standalone-consumer.sh

      - name: Record runner environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          {
            echo "revision=${GITHUB_SHA}"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            java -version
            ./gradlew --version
            docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}}'
          } > build/ci-evidence/environment.txt 2>&1

      - name: Upload aggregate SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routecontract-sbom-${{ github.sha }}
          path: |
            build/reports/verified-sbom/aggregate/bom.json
            build/reports/verified-sbom/aggregate/bom.xml
          if-no-files-found: error
          retention-days: 90

      - name: Upload test and environment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routecontract-test-evidence-${{ github.sha }}
          path: |
            routecontract-shardingsphere-5.5/build/test-results/test/*.xml
            examples/mysql/build/test-results/test/*.xml
            examples/standalone-consumer/build/test-results/test/*.xml
            build/ci-evidence/environment.txt
          if-no-files-found: warn
          retention-days: 90

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
