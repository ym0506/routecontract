name: Release evidence

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-release-evidence:
    name: Build release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          architecture: x64
          verify-signature: true

      - name: Verify exact Temurin runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f "${JAVA_HOME}/release"
          test "$(grep -Ec '^IMPLEMENTOR_VERSION=' "${JAVA_HOME}/release")" = '1'
          test "$(grep -Ec '^JAVA_RUNTIME_VERSION=' "${JAVA_HOME}/release")" = '1'
          grep -Fxq 'IMPLEMENTOR_VERSION="Temurin-17.0.20.1+1"' "${JAVA_HOME}/release"
          grep -Fxq 'JAVA_RUNTIME_VERSION="17.0.20.1+1"' "${JAVA_HOME}/release"
          test "$("${JAVA_HOME}/bin/java" -fullversion 2>&1)" = 'openjdk full version "17.0.20.1+1"'
          test -f "${JAVA_HOME}/jmods/jdk.javadoc.jmod"
          test ! -L "${JAVA_HOME}/jmods/jdk.javadoc.jmod"
          test "$(sha256sum "${JAVA_HOME}/jmods/jdk.javadoc.jmod" | awk '{print $1}')" = '4fd0541eb01b08f79a280484ec11569d87cebdf2b90a5e5b4bff695732d049ea'

      - name: Validate and configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: disabled
          validate-wrappers: true

      - name: Require tag revision and public main to match
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = 'push'
          test "${GITHUB_REF_TYPE}" = 'tag'
          test "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}"
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${tag_ref}")" = 'tag'
          tagged_commit="$(git rev-parse "${tag_ref}^{commit}")"
          test "${tagged_commit}" = "${GITHUB_SHA}"
          main_commit="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          test -n "${main_commit}"
          test "${tagged_commit}" = "${main_commit}"

      - name: Verify public Quick Start
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          test -z "$(git clean -ndx)"
          quickstart_gradle_home="${RUNNER_TEMP}/routecontract-quickstart-gradle-home"
          test ! -e "${quickstart_gradle_home}"
          GRADLE_USER_HOME="${quickstart_gradle_home}" ./scripts/quickstart-demo.sh

      - name: Require tag and project versions to match
        id: release_family
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(./gradlew --no-daemon -q properties | awk '/^version:/ { print $2; exit }')"
          release_version_pattern='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-rc[1-9][0-9]{0,5})?$'
          if [[ ! "${project_version}" =~ ${release_version_pattern} ]]; then
            echo "Project version is not a stable or strict RC release version: ${project_version}" >&2
            exit 1
          fi
          test "v${project_version}" = "${GITHUB_REF_NAME}"
          if [[ "${project_version}" =~ ^0\.1\. ]]; then
            family='legacy'
          elif [[ "${project_version}" =~ ^0\.2\.(0|[1-9][0-9]*)$ ]]; then
            family='split'
          else
            echo 'No reviewed release preparation contract for this version' >&2
            exit 1
          fi
          printf 'family=%s\nversion=%s\n' "${family}" "${project_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up report-package Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          architecture: x64
          check-latest: false

      - name: Install checksum-locked report-package test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import platform, sys; sys.exit(0 if (sys.version_info[:3] == (3, 12, 14) and platform.python_implementation() == "CPython" and platform.machine() == "x86_64") else 1)'
          report_venv="${RUNNER_TEMP}/routecontract-report-test-venv"
          test ! -e "${report_venv}"
          python -m venv "${report_venv}"
          "${report_venv}/bin/python" -m pip install \
            --isolated --disable-pip-version-check --no-input \
            --index-url https://pypi.org/simple \
            --only-binary=:all: --no-deps --require-hashes \
            --requirement submission/report-package-ci-requirements.txt

      - name: Test fail-closed contest packaging rules
        run: |
          "${RUNNER_TEMP}/routecontract-report-test-venv/bin/python" \
            -m unittest discover -s submission/tools/tests -v
          "${RUNNER_TEMP}/routecontract-report-test-venv/bin/python" \
            -m unittest discover -s scripts/tests -v

      - name: Test and build evidence
        run: >-
          ./gradlew --no-daemon --no-build-cache clean check
          validateOfficialCycloneDxSbom
          :routecontract-core:assemble
          :routecontract-core:generatePomFileForMavenJavaPublication
          :routecontract-shardingsphere-5.5:assemble
          :routecontract-shardingsphere-5.5:generatePomFileForMavenJavaPublication
          :routecontract-shardingsphere-5.5.2:assemble
          :routecontract-shardingsphere-5.5.2:generatePomFileForMavenJavaPublication
          :routecontract-shardingsphere-5.5:generateMetadataFileForMavenJavaPublication

      - name: Assert verified SBOM metadata in JSON and XML
        shell: bash
        run: |
          set -euo pipefail
          project_group="$(./gradlew --no-daemon -q properties | awk '/^group:/ { print $2; exit }')"
          python3 scripts/finalize-sbom.py \
            --first-party-group "${project_group}" \
            --verify-pair \
            build/reports/verified-sbom/aggregate/bom.json \
            build/reports/verified-sbom/aggregate/bom.xml \
            --verify-pair \
            build/reports/verified-sbom/routecontract-core/bom.json \
            build/reports/verified-sbom/routecontract-core/bom.xml \
            --verify-pair \
            build/reports/verified-sbom/routecontract-shardingsphere-5.5/bom.json \
            build/reports/verified-sbom/routecontract-shardingsphere-5.5/bom.xml \
            --verify-pair \
            build/reports/verified-sbom/routecontract-shardingsphere-5.5.2/bom.json \
            build/reports/verified-sbom/routecontract-shardingsphere-5.5.2/bom.xml \
            --verify-pair \
            build/reports/verified-sbom/mysql-example/bom.json \
            build/reports/verified-sbom/mysql-example/bom.xml \
            --verify-pair \
            build/reports/verified-sbom/mysql-5.5.2-example/bom.json \
            build/reports/verified-sbom/mysql-5.5.2-example/bom.xml

      - name: Produce exact-revision sanitized supply-chain evidence
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-final-supply-chain-scan.sh --revision "${GITHUB_SHA}"
          test -f build/reports/security/supply-chain-evidence.json
          test ! -L build/reports/security/supply-chain-evidence.json

      - name: Create revision-bound privacy-minimized test summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-public
          python3 scripts/summarize-test-results.py \
            --revision "${GITHUB_SHA}" \
            --results-dir routecontract-core/build/test-results/test \
            --results-dir routecontract-shardingsphere-5.5/build/test-results/test \
            --results-dir routecontract-shardingsphere-5.5.2/build/test-results/test \
            --results-dir examples/mysql/build/test-results/test \
            --results-dir examples/mysql-5.5.2/build/test-results/test \
            --output build/release-public/test-summary.txt

      - name: Stage legacy single-artifact Release subset and checksums
        if: steps.release_family.outputs.family == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          public_dir='build/release-public'
          test "$(find routecontract-shardingsphere-5.5/build/libs -maxdepth 1 -type f -name '*.jar' | wc -l | tr -d ' ')" = '3'
          cp routecontract-shardingsphere-5.5/build/libs/*.jar "${public_dir}/"
          cp routecontract-shardingsphere-5.5/build/publications/mavenJava/pom-default.xml "${public_dir}/routecontract-shardingsphere-5.5.pom"
          cp build/reports/verified-sbom/routecontract-shardingsphere-5.5/bom.json "${public_dir}/routecontract-shardingsphere-5.5-cyclonedx.json"
          cp build/reports/verified-sbom/routecontract-shardingsphere-5.5/bom.xml "${public_dir}/routecontract-shardingsphere-5.5-cyclonedx.xml"
          cp build/reports/verified-sbom/aggregate/bom.json "${public_dir}/routecontract-aggregate-cyclonedx.json"
          cp build/reports/verified-sbom/aggregate/bom.xml "${public_dir}/routecontract-aggregate-cyclonedx.xml"
          cp build/reports/security/supply-chain-evidence.json "${public_dir}/supply-chain-evidence.json"
          project_version="$(./gradlew --no-daemon -q properties | awk '/^version:/ { print $2; exit }')"
          public_payloads=(
            "routecontract-${project_version}-source.zip"
            "routecontract-shardingsphere-5.5-${project_version}.jar"
            "routecontract-shardingsphere-5.5-${project_version}-sources.jar"
            "routecontract-shardingsphere-5.5-${project_version}-javadoc.jar"
            'routecontract-shardingsphere-5.5.pom'
            'routecontract-shardingsphere-5.5-cyclonedx.json'
            'routecontract-shardingsphere-5.5-cyclonedx.xml'
            'routecontract-aggregate-cyclonedx.json'
            'routecontract-aggregate-cyclonedx.xml'
            'supply-chain-evidence.json'
            'test-summary.txt'
          )
          git archive \
            --format=zip \
            --prefix="routecontract-${project_version}/" \
            --output="${public_dir}/routecontract-${project_version}-source.zip" \
            "${GITHUB_SHA}"
          test "$(find "${public_dir}" -maxdepth 1 -type f | wc -l | tr -d ' ')" = '11'
          for payload in "${public_payloads[@]}"; do
            test -f "${public_dir}/${payload}"
          done
          (
            cd "${public_dir}"
            sha256sum "${public_payloads[@]}" > SHA256SUMS
          )
          test "$(find "${public_dir}" -maxdepth 1 -type f | wc -l | tr -d ' ')" = '12'
          test "$(wc -l < "${public_dir}/SHA256SUMS" | tr -d ' ')" = '11'

      - name: Verify legacy single-artifact subset in a standalone MySQL consumer
        if: steps.release_family.outputs.family == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          test ! -e build/release-consumer-maven
          ./scripts/verify-release-assets-consumer.sh \
            "$PWD/build/release-public" \
            "$PWD/build/release-consumer-maven" 2>&1 \
            | tee build/release-evidence/standalone-consumer.txt
          grep -Fq 'ROUTECONTRACT_RELEASE_ASSET_CONSUMER' \
            build/release-evidence/standalone-consumer.txt

      - name: Retain the exact unsigned Central candidate payloads
        if: steps.release_family.outputs.family == 'legacy'
        id: central_candidate
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(./gradlew --no-daemon -q properties | awk '/^version:/ { print $2; exit }')"
          if [[ ! "${project_version}" =~ ^0\.1\.([3-9]|[1-9][0-9]+)$ ]]; then
            echo 'available=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 - "${project_version}" "${GITHUB_SHA}" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          version, revision = sys.argv[1:]
          if not re.fullmatch(r'0\.1\.(?:[3-9]|[1-9][0-9]+)', version):
              raise SystemExit('Central candidate evidence requires stable 0.1.3 or later 0.1.x')
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Expected the exact tagged source revision')
          module = 'routecontract-shardingsphere-5.5'
          destination = Path('build/central-candidate-evidence')
          destination.mkdir()
          sources = {
              f'{module}-{version}.jar': Path(f'{module}/build/libs/{module}-{version}.jar'),
              f'{module}-{version}-sources.jar': Path(f'{module}/build/libs/{module}-{version}-sources.jar'),
              f'{module}-{version}-javadoc.jar': Path(f'{module}/build/libs/{module}-{version}-javadoc.jar'),
              f'{module}-{version}.pom': Path(f'{module}/build/publications/mavenJava/pom-default.xml'),
              f'{module}-{version}.module': Path(f'{module}/build/publications/mavenJava/module.json'),
          }
          records = []
          for name, source in sorted(sources.items()):
              if source.is_symlink() or not source.is_file():
                  raise SystemExit('Missing regular Central candidate payload')
              payload = source.read_bytes()
              if not payload or len(payload) > 256 * 1024 * 1024:
                  raise SystemExit('Unexpected Central candidate payload size')
              with (destination / name).open('xb') as output:
                  output.write(payload)
              records.append({'name': name, 'size': len(payload), 'sha256': hashlib.sha256(payload).hexdigest()})
          receipt = {'formatVersion': 1, 'kind': 'routecontract-generated-central-candidate',
                     'sourceRevision': revision,
                     'coordinate': {'groupId': 'io.github.ym0506.routecontract', 'artifactId': module, 'version': version},
                     'payloads': records, 'reviewed': False, 'signed': False, 'published': False}
          with (destination / 'candidate-payloads.json').open('x', encoding='utf-8') as output:
              json.dump(receipt, output, indent=2, sort_keys=True)
              output.write('\n')
          PY
          echo 'available=true' >> "${GITHUB_OUTPUT}"

      - name: Collect and validate coordinated unsigned split preparation
        if: steps.release_family.outputs.family == 'split'
        id: split_candidate
        shell: bash
        run: |
          set -euo pipefail
          project_version='${{ steps.release_family.outputs.version }}'
          unsigned_repository="${RUNNER_TEMP}/routecontract-release-unsigned"
          test ! -e "${unsigned_repository}"
          ./gradlew --no-daemon --no-build-cache publishRouteContractCentralStaging \
            -ProutecontractCentralSigning=false \
            -ProutecontractCentralStagingDirectory="${unsigned_repository}"
          python3 scripts/prepare-coordinated-release-evidence.py collect \
            --repository "${unsigned_repository}" --source-root "$PWD" \
            --version "${project_version}" --revision "${GITHUB_SHA}" \
            --java-home "${JAVA_HOME}" --output "$PWD/build/central-candidate-evidence"
          python3 scripts/prepare-coordinated-release-evidence.py verify \
            --source-root "$PWD" --version "${project_version}" \
            --revision "${GITHUB_SHA}" --java-home "${JAVA_HOME}" \
            --output "$PWD/build/central-candidate-evidence"
          echo 'available=true' >> "${GITHUB_OUTPUT}"

      - name: Upload unsigned Central candidate evidence
        if: steps.central_candidate.outputs.available == 'true' || steps.split_candidate.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routecontract-central-candidate-${{ github.sha }}
          path: build/central-candidate-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Install exact Apache Maven 3.9.14 for split consumers
        if: steps.release_family.outputs.family == 'split'
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          maven_archive="${RUNNER_TEMP}/apache-maven-3.9.14-bin.tar.gz"
          maven_home="${RUNNER_TEMP}/apache-maven-3.9.14"
          maven_url="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.14/apache-maven-3.9.14-bin.tar.gz"
          expected_sha512="d50af8ab5e6005b46a07f0ce9d3719e67cfdf898da988a84871304cd59fb1af0fef2f99dea709e6e66f21f732f905979b5c2dce6b6860406f60a70e84d9cf0b8"

          test ! -e "${maven_archive}"
          test ! -L "${maven_archive}"
          test ! -e "${maven_home}"
          test ! -L "${maven_home}"
          curl --disable --proto '=https' --tlsv1.2 --fail --location \
            --silent --show-error --retry 3 --connect-timeout 15 --max-time 300 \
            --remove-on-error \
            --max-filesize 20971520 \
            --output "${maven_archive}" \
            "${maven_url}"
          printf '%s  %s\n' "${expected_sha512}" "${maven_archive}" \
            | sha512sum --check --strict
          tar --extract --gzip --file "${maven_archive}" --directory "${RUNNER_TEMP}"
          test -d "${maven_home}"
          test ! -L "${maven_home}"
          test -f "${maven_home}/bin/mvn"
          test ! -L "${maven_home}/bin/mvn"
          test -x "${maven_home}/bin/mvn"
          maven_version="$("${maven_home}/bin/mvn" -version 2>&1)"
          printf '%s\n' "${maven_version}" | grep -Fqx \
            'Apache Maven 3.9.14 (996c630dbc656c76214ce58821dcc58be960875b)'
          printf '%s\n' "${maven_version}" | grep -Eq '^Java version: 17\.'
          printf 'MAVEN_HOME=%s\n' "${maven_home}" >> "${GITHUB_ENV}"
          printf '%s\n' "${maven_home}/bin" >> "${GITHUB_PATH}"


      - name: Verify retained split preparation through independent MySQL consumers
        if: steps.release_family.outputs.family == 'split'
        shell: bash
        timeout-minutes: 30
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          set -euo pipefail
          test -r "${SSL_CERT_FILE}"
          prepared_repository="$PWD/build/central-candidate-evidence/repository"
          python3 scripts/verify-staged-split-artifact-consumer.py \
            --repository "${prepared_repository}" \
            --evidence-directory "${RUNNER_TEMP}/routecontract-release-split-gradle"
          python3 scripts/verify-staged-maven-artifact-consumer.py \
            --repository "${prepared_repository}" --java-home "${JAVA_HOME}" \
            --evidence-directory "${RUNNER_TEMP}/routecontract-release-split-maven"
          python3 scripts/prepare-coordinated-release-evidence.py verify \
            --source-root "$PWD" --version '${{ steps.release_family.outputs.version }}' \
            --revision "${GITHUB_SHA}" --java-home "${JAVA_HOME}" \
            --output "$PWD/build/central-candidate-evidence"

      - name: Retain minimized split-consumer execution evidence
        if: always() && steps.release_family.outputs.family == 'split' && steps.split_candidate.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routecontract-release-split-consumers-${{ github.sha }}
          path: |
            ${{ runner.temp }}/routecontract-release-split-gradle/summary.json
            ${{ runner.temp }}/routecontract-release-split-gradle/staged-receipt.json
            ${{ runner.temp }}/routecontract-release-split-gradle/5.5.*/reports/**
            ${{ runner.temp }}/routecontract-release-split-maven/summary.json
            ${{ runner.temp }}/routecontract-release-split-maven/staged-receipt.json
            ${{ runner.temp }}/routecontract-release-split-maven/5.5.*/summary.json
            ${{ runner.temp }}/routecontract-release-split-maven/5.5.*/reports/**
          if-no-files-found: error
          retention-days: 90

      - name: Stage workflow-only environment evidence
        if: steps.release_family.outputs.family == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          public_dir='build/release-public'
          evidence_dir='build/release-evidence'
          cp "${public_dir}"/* "${evidence_dir}/"
          # These workflow-only copies complete the six-role/twelve-document SBOM
          # evidence set. They do not make the legacy single-artifact Release
          # consumer a valid 0.2 three-coordinate public-consumption gate.
          cp build/reports/verified-sbom/routecontract-core/bom.json \
            "${evidence_dir}/routecontract-core-cyclonedx.json"
          cp build/reports/verified-sbom/routecontract-core/bom.xml \
            "${evidence_dir}/routecontract-core-cyclonedx.xml"
          cp build/reports/verified-sbom/routecontract-shardingsphere-5.5.2/bom.json \
            "${evidence_dir}/routecontract-shardingsphere-5.5.2-cyclonedx.json"
          cp build/reports/verified-sbom/routecontract-shardingsphere-5.5.2/bom.xml \
            "${evidence_dir}/routecontract-shardingsphere-5.5.2-cyclonedx.xml"
          cp build/reports/verified-sbom/mysql-example/bom.json \
            "${evidence_dir}/routecontract-mysql-example-cyclonedx.json"
          cp build/reports/verified-sbom/mysql-example/bom.xml \
            "${evidence_dir}/routecontract-mysql-example-cyclonedx.xml"
          cp build/reports/verified-sbom/mysql-5.5.2-example/bom.json \
            "${evidence_dir}/routecontract-mysql-5.5.2-example-cyclonedx.json"
          cp build/reports/verified-sbom/mysql-5.5.2-example/bom.xml \
            "${evidence_dir}/routecontract-mysql-5.5.2-example-cyclonedx.xml"
          mysql_image_tag='mysql:8.4.11'
          expected_mysql_digest='sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb'
          resolved_mysql_image_ids="$(
            docker image ls --digests --no-trunc --format '{{.Repository}}|{{.Digest}}|{{.ID}}' \
              | awk -F'|' -v digest="${expected_mysql_digest}" \
                '($1 == "mysql" || $1 == "docker.io/library/mysql") && \
                 $2 == digest && $3 ~ /^sha256:[0-9a-f]{64}$/ { print $3 }' \
              | sort -u
          )"
          test -n "${resolved_mysql_image_ids}"
          test "$(printf '%s\n' "${resolved_mysql_image_ids}" | wc -l | tr -d ' ')" = '1'
          resolved_mysql_image_id="${resolved_mysql_image_ids}"
          {
            echo "revision=${GITHUB_SHA}"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "uname_m=$(uname -m)"
            java -fullversion
            java -version
            ./gradlew --version
            docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}}'
          } > "${evidence_dir}/environment.txt" 2>&1
          {
            echo "image_reference=${mysql_image_tag}@${expected_mysql_digest}"
            docker image inspect "${resolved_mysql_image_id}" --format 'image_id={{.Id}}'
            docker image inspect "${resolved_mysql_image_id}" --format 'image_os={{.Os}}'
            docker image inspect "${resolved_mysql_image_id}" --format 'image_architecture={{.Architecture}}'
            docker image inspect "${resolved_mysql_image_id}" --format 'image_repo_digests={{json .RepoDigests}}'
          } > "${evidence_dir}/mysql-image.txt"
          grep -Fq 'image_id=sha256:' "${evidence_dir}/mysql-image.txt"
          grep -F 'image_repo_digests=' "${evidence_dir}/mysql-image.txt" \
            | grep -Eq \
              "\"(mysql|docker\\.io/library/mysql)@${expected_mysql_digest}\""
          ! grep -Eq \
            '  (environment|mysql-image|standalone-consumer)\.txt$|  routecontract-(core|shardingsphere-5\.5\.2|mysql-example|mysql-5\.5\.2-example)-cyclonedx\.(json|xml)$' \
            "${evidence_dir}/SHA256SUMS"
          test ! -e "${evidence_dir}/osv-raw.json"
          test "$(find "${evidence_dir}" -maxdepth 1 -type f | wc -l | tr -d ' ')" = '23'

      - name: Revalidate all staged CycloneDX release-evidence SBOMs
        if: steps.release_family.outputs.family == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='build/release-evidence'
          project_group="$(./gradlew --no-daemon -q properties | awk '/^group:/ { print $2; exit }')"
          staged_sboms=(
            "${evidence_dir}/routecontract-aggregate-cyclonedx.json"
            "${evidence_dir}/routecontract-aggregate-cyclonedx.xml"
            "${evidence_dir}/routecontract-core-cyclonedx.json"
            "${evidence_dir}/routecontract-core-cyclonedx.xml"
            "${evidence_dir}/routecontract-shardingsphere-5.5-cyclonedx.json"
            "${evidence_dir}/routecontract-shardingsphere-5.5-cyclonedx.xml"
            "${evidence_dir}/routecontract-shardingsphere-5.5.2-cyclonedx.json"
            "${evidence_dir}/routecontract-shardingsphere-5.5.2-cyclonedx.xml"
            "${evidence_dir}/routecontract-mysql-example-cyclonedx.json"
            "${evidence_dir}/routecontract-mysql-example-cyclonedx.xml"
            "${evidence_dir}/routecontract-mysql-5.5.2-example-cyclonedx.json"
            "${evidence_dir}/routecontract-mysql-5.5.2-example-cyclonedx.xml"
          )
          staged_sbom_binding="$(sha256sum "${staged_sboms[@]}")"
          python3 scripts/finalize-sbom.py \
            --first-party-group "${project_group}" \
            --verify-pair \
            "${evidence_dir}/routecontract-aggregate-cyclonedx.json" \
            "${evidence_dir}/routecontract-aggregate-cyclonedx.xml" \
            --verify-pair \
            "${evidence_dir}/routecontract-core-cyclonedx.json" \
            "${evidence_dir}/routecontract-core-cyclonedx.xml" \
            --verify-pair \
            "${evidence_dir}/routecontract-shardingsphere-5.5-cyclonedx.json" \
            "${evidence_dir}/routecontract-shardingsphere-5.5-cyclonedx.xml" \
            --verify-pair \
            "${evidence_dir}/routecontract-shardingsphere-5.5.2-cyclonedx.json" \
            "${evidence_dir}/routecontract-shardingsphere-5.5.2-cyclonedx.xml" \
            --verify-pair \
            "${evidence_dir}/routecontract-mysql-example-cyclonedx.json" \
            "${evidence_dir}/routecontract-mysql-example-cyclonedx.xml" \
            --verify-pair \
            "${evidence_dir}/routecontract-mysql-5.5.2-example-cyclonedx.json" \
            "${evidence_dir}/routecontract-mysql-5.5.2-example-cyclonedx.xml"
          python3 scripts/validate-official-cyclonedx.py \
            --input-root "${evidence_dir}" \
            --pair aggregate \
            routecontract-aggregate-cyclonedx.json \
            routecontract-aggregate-cyclonedx.xml \
            --pair core \
            routecontract-core-cyclonedx.json \
            routecontract-core-cyclonedx.xml \
            --pair adapter553 \
            routecontract-shardingsphere-5.5-cyclonedx.json \
            routecontract-shardingsphere-5.5-cyclonedx.xml \
            --pair adapter552 \
            routecontract-shardingsphere-5.5.2-cyclonedx.json \
            routecontract-shardingsphere-5.5.2-cyclonedx.xml \
            --pair mysql553 \
            routecontract-mysql-example-cyclonedx.json \
            routecontract-mysql-example-cyclonedx.xml \
            --pair mysql552 \
            routecontract-mysql-5.5.2-example-cyclonedx.json \
            routecontract-mysql-5.5.2-example-cyclonedx.xml
          test "$(sha256sum "${staged_sboms[@]}")" = "${staged_sbom_binding}"

      - name: Upload release evidence
        if: steps.release_family.outputs.family == 'legacy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routecontract-release-evidence-${{ github.sha }}
          path: build/release-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Keep 0.2 publication fail-closed until the public split-artifact gate exists
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(./gradlew --no-daemon -q properties | awk '/^version:/ { print $2; exit }')"
          if [[ "${project_version}" == 0.2.* ]]; then
            echo '0.2 publication is blocked: the legacy single-artifact Release consumer does not prove clean-cache, unauthenticated consumption of core + adapter553 + adapter552 with whole-group and negative-exclusivity checks.' >&2
            exit 1
          fi
