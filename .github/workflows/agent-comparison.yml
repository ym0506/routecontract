name: Agent comparison (opt-in research)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: agent-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-agent-comparison'
    name: Agent 5.5.3 / Java 17 / MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPERIMENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        working-directory: experiments/agent-comparison
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          verify-signature: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install Maven 3.9.14
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/apache-maven-3.9.14-bin.tar.gz"
          curl --disable --fail --location --silent --show-error --retry 3 \
            --connect-timeout 15 --max-time 300 --output "$archive" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.14/apache-maven-3.9.14-bin.tar.gz
          printf '%s  %s\n' \
            d50af8ab5e6005b46a07f0ce9d3719e67cfdf898da988a84871304cd59fb1af0fef2f99dea709e6e66f21f732f905979b5c2dce6b6860406f60a70e84d9cf0b8 \
            "$archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "${RUNNER_TEMP}/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"

      - name: Verify synthetic classifier and receiver controls
        run: python3 -m unittest -v

      - name: Measure the same physical executions
        run: python3 run.py

      - name: Retain only minimized results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-comparison-${{ github.sha }}
          path: |
            experiments/agent-comparison/target/comparison/summary.json
            experiments/agent-comparison/target/comparison/junit-sanitized.xml
          if-no-files-found: error
          retention-days: 90
