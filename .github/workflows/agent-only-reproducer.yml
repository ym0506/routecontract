name: ShardingSphere Agent runtime-absent reproducer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-only-reproducer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Official Agent 5.5.3 / RouteContract runtime absent
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate and configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: disabled
          validate-wrappers: true

      - name: Test the bounded verifier
        run: python3 -m unittest scripts.tests.test_verify_agent_comparison -v

      - name: Run the checksum-pinned official Agent reproducer
        run: python3 scripts/verify-agent-comparison.py --agent-only

      - name: Verify the exact canonical artifact
        run: >-
          python3 scripts/verify-agent-comparison.py
          --agent-only
          --verify-summary-only

      - name: Upload the canonical aggregate only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shardingsphere-agent-runtime-absent-${{ github.sha }}
          path: build/agent-only-reproducer/summary.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
