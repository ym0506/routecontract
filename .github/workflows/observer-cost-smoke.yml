name: Observer cost harness smoke

on:
  pull_request:
    paths:
      - 'examples/observer-cost/**'
      - 'examples/first-project/src/test/**'
      - '.github/workflows/observer-cost-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observer-cost-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Three classpaths / real MySQL / smoke only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          verify-signature: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Check the harness; do not publish performance claims from CI smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 examples/observer-cost/run.py --smoke \
            --output "${RUNNER_TEMP}/observer-cost-smoke"
      - name: Check capture cleanup and retained-result sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python3 examples/observer-cost/retention/run.py --smoke \
            --maven-repository "${RUNNER_TEMP}/observer-cost-smoke/m2" \
            --output "${RUNNER_TEMP}/capture-retention-smoke"
      - name: Preserve smoke evidence without dependency caches
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observer-cost-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/observer-cost-smoke/run.json
            ${{ runner.temp }}/observer-cost-smoke/summary.json
            ${{ runner.temp }}/observer-cost-smoke/block-*.json
            ${{ runner.temp }}/observer-cost-smoke/block-*.log
            ${{ runner.temp }}/observer-cost-smoke/build.log
            ${{ runner.temp }}/capture-retention-smoke/run.json
            ${{ runner.temp }}/capture-retention-smoke/trial-*/checkpoints.json
            ${{ runner.temp }}/capture-retention-smoke/build.log
          if-no-files-found: warn
          retention-days: 30
