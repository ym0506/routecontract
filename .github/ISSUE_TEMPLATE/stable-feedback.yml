name: Stable v0.1.0 feedback
description: Share a first run, blocker, documentation note, or fit assessment for RouteContract v0.1.0.
title: "[stable-feedback] "
labels: [community, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying or reviewing RouteContract v0.1.0. Positive, negative, blocked, and not-a-fit outcomes are all useful.

        This form records self-reported usability and fit feedback. It does not by itself establish production use, adoption, security, performance, or endorsement.

        Share only the useful minimum. Remove credentials, raw SQL and bind values, JDBC URLs, customer data, private topology, hostnames, absolute paths, full logs, screenshots, and personal information. If this may be a vulnerability, stop and use [private vulnerability reporting](https://github.com/ym0506/routecontract/security/advisories/new).

  - type: dropdown
    id: integration_stage
    attributes:
      label: Highest consecutive integration stage completed
      description: Choose the last stage reached in order. Each numbered stage includes the earlier stages.
      options:
        - Stage 0 — reviewed the README and support boundary
        - Stage 1 — also ran the exact v0.1.0 Quick Start
        - Stage 2 — also verified and installed the exact v0.1.0 Release assets
        - Stage 3 — also captured one representative operation in my own repository
        - Stage 4 — also human-reviewed and committed an approved baseline
        - Stage 5 — also ran a candidate check against that baseline in my own repository or CI
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Worked as documented
        - Documentation review only
        - Product or documentation blocker
        - Prerequisite or environment blocker
        - Not a fit for my use case
        - Stopped before completion
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment, if code ran
      description: Version and platform only; no employer, hostname, or private path is needed.
      placeholder: RouteContract 0.1.0; ShardingSphere-JDBC 5.5.3; Java 17; Linux x86_64; Docker 27

  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: A few sentences are enough. Include the first unclear point, verification marker, or minimized blocker; do not paste full logs.
    validations:
      required: true

  - type: textarea
    id: fit
    attributes:
      label: What would make this useful for your work?
      description: Optional. “Nothing; this is not my problem” is also useful feedback.

  - type: textarea
    id: public_evidence
    attributes:
      label: Public evidence URL(s), if any
      description: Optional; leave blank when there is no public evidence or the repository is private. Link only to a public repository, test, pull request, or CI run that is safe to share. Without verifiable public evidence, this remains valuable self-reported feedback but is not counted as a verified external integration. A link or self-report does not by itself establish production use, adoption, performance, security, or endorsement.
      placeholder: https://github.com/example/project/pull/123

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-information check
      options:
        - label: I removed secrets, raw SQL and bind values, customer data, private topology, private paths, full logs, screenshots, and unnecessary personal information.
          required: true
