name: Stable v0.1.2 feedback
description: Share a first run, blocker, documentation note, or fit assessment for RouteContract v0.1.2.
title: "[stable-feedback] "
labels: [community, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying or reviewing RouteContract v0.1.2. Positive, negative, blocked, and not-a-fit outcomes are all useful.

        This form records self-reported usability and fit feedback. It does not by itself establish production use, adoption, security, performance, or endorsement.

        Share only the useful minimum. Remove credentials, raw SQL and bind values, JDBC URLs, customer data, private topology, hostnames, absolute paths, full logs, screenshots, and personal information. If this may be a vulnerability, stop and use [private vulnerability reporting](https://github.com/ym0506/routecontract/security/advisories/new).

  - type: dropdown
    id: integration_stage
    attributes:
      label: Highest consecutive integration stage completed
      description: Choose the last stage reached in order. Each numbered stage includes the earlier stages.
      options:
        - Stage 0 — reviewed the README and support boundary
        - Stage 1 — also ran the exact v0.1.2 Quick Start
        - Stage 2 — also verified and installed the exact v0.1.2 Release assets
        - Stage 3 — also captured one representative operation in a repository I own, maintain, or am authorized to modify
        - Stage 4 — an authorized owner or maintainer there also reviewed and approved the exact baseline
        - Stage 5 — also ran a candidate check locally or in non-upstream CI
        - Stage 6 — also ran the candidate check in the repository's upstream public CI
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Worked as documented
        - Documentation review only
        - Product or documentation blocker
        - Prerequisite or environment blocker
        - Not a fit for my use case
        - Stopped before completion
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment, if code ran
      description: Version and platform only; no employer, hostname, or private path is needed.
      placeholder: RouteContract 0.1.2; ShardingSphere-JDBC 5.5.3; Java 17; Linux x86_64; Docker 27

  - type: textarea
    id: result
    attributes:
      label: What happened, and what would help?
      description: A few sentences are enough. Include the first unclear point, verification marker, minimized blocker, or missing capability; do not paste full logs.
    validations:
      required: true

  - type: textarea
    id: public_evidence
    attributes:
      label: Public evidence URL(s), if any
      description: >-
        Optional; leave blank when there is no public evidence or the repository is private.
        Only a verified Stage 6 result can establish an actual external integration: link the
        immutable source commit, dependency, representative test, exact baseline approved by an
        authorized owner or maintainer of that external repository, approval record, and upstream
        public CI run for that commit. A PR may provide additional review context. A private,
        local-only, draft, or self-reported result is feedback only and does not establish an actual
        external integration, production use, adoption, performance, security, or endorsement.
      placeholder: |
        Source commit or PR:
        Dependency/build:
        Representative test:
        Approved baseline:
        Human-review record:
        CI run + tested commit:

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-information check
      options:
        - label: I did not paste credentials, raw SQL or bind values, JDBC URLs, customer data, private topology, hostnames, absolute paths, logs, screenshots, or unnecessary personal information, and I checked any linked public evidence for the same risks.
          required: true
