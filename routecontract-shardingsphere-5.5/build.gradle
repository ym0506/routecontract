plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

description = 'Operation-scoped contracts over physical JDBC execution attempts reported by Apache ShardingSphere-JDBC 5.5.3 SQLExecutionHook'
ext.routecontractPomName = 'RouteContract for Apache ShardingSphere-JDBC 5.5.3'

dependencies {
    // ShardingSphere 5.5.3 brings the legacy com.fasterxml.jackson 2.x line.
    // Align that compatibility graph to the patched family without changing
    // RouteContract's separate tools.jackson 3.x runtime dependency.
    compileOnly platform("com.fasterxml.jackson:jackson-bom:${shardingSphereJacksonVersion}")
    compileOnly "org.apache.shardingsphere:shardingsphere-infra-executor:${shardingSphereVersion}"
    implementation "com.alibaba:transmittable-thread-local:${transmittableThreadLocalVersion}"
    implementation "tools.jackson.core:jackson-core:${jacksonVersion}"

    testImplementation platform("com.fasterxml.jackson:jackson-bom:${shardingSphereJacksonVersion}")
    testImplementation "org.apache.shardingsphere:shardingsphere-infra-executor:${shardingSphereVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'manifest-ci-failure-demo'
    }
}

tasks.register('manifestCiFailureDemo', Test) {
    group = 'verification'
    description = 'Intentionally fails on the committed manifest regression example'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'manifest-ci-failure-demo'
    }
    systemProperty 'routecontract.repositoryRoot', rootProject.projectDir.absolutePath
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('reviewManifest', JavaExec) {
    group = 'verification'
    description = 'Compare two manifests and create a minimized CI review report; fails on any non-match'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.ym0506.routecontract.manifest.ManifestReviewCli'
    workingDir = rootProject.projectDir
    doFirst {
        for (property in ['approvedManifest', 'candidateManifest', 'reviewReportOutput']) {
            if (!providers.gradleProperty(property).isPresent()) {
                throw new GradleException("Missing -P${property}; see docs/ci-review-report.md")
            }
        }
        args '--baseline', providers.gradleProperty('approvedManifest').get(),
                '--candidate', providers.gradleProperty('candidateManifest').get(),
                '--format', providers.gradleProperty('reviewReportFormat').getOrElse('markdown'),
                '--output', providers.gradleProperty('reviewReportOutput').get()
    }
}

jar {
    manifest {
        attributes('Automatic-Module-Name': 'io.github.ym0506.routecontract.shardingsphere55')
    }
}

apply from: rootProject.file('gradle/routecontract-library.gradle')
