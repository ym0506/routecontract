plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Operation-scoped contracts over physical JDBC execution attempts reported by Apache ShardingSphere-JDBC 5.5.3 SQLExecutionHook'

dependencies {
    api project(':routecontract-core')

    // ShardingSphere 5.5.3 brings the legacy com.fasterxml.jackson 2.x line.
    // Align that compatibility graph to the patched family without changing
    // RouteContract's separate tools.jackson 3.x runtime dependency.
    implementation platform("com.fasterxml.jackson:jackson-bom:${shardingSphereJacksonVersion}")
    implementation('org.apache.shardingsphere:shardingsphere-infra-executor') {
        version {
            strictly(shardingSphereVersion)
        }
        because 'SQLExecutionHook has an exact 5.5.3 binary descriptor'
    }
    constraints {
        implementation('org.apache.shardingsphere:shardingsphere-infra-spi') {
            version {
                strictly(shardingSphereVersion)
            }
            because 'the runtime-adapter preflight requires the exact 5.5.3 SPI anchor'
        }
        implementation('org.apache.shardingsphere:shardingsphere-database-connector-core') {
            version {
                strictly(shardingSphereVersion)
            }
            because 'the hook method descriptor requires the exact 5.5.3 connection-properties anchor'
        }
    }
    testImplementation platform("com.fasterxml.jackson:jackson-bom:${shardingSphereJacksonVersion}")
    testImplementation "org.apache.shardingsphere:shardingsphere-infra-executor:${shardingSphereVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def exclusiveAdapterCapability =
        'io.github.ym0506.routecontract:routecontract-shardingsphere-hook-adapter:1'
['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) {
        outgoing.capability("${project.group}:${project.name}:${project.version}")
        outgoing.capability(exclusiveAdapterCapability)
    }
}

def adapterJarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
def coreJarFile = project(':routecontract-core').tasks.named('jar', Jar).flatMap { it.archiveFile }
def adapterPomFile = layout.buildDirectory.file('publications/mavenJava/pom-default.xml')
def adapterModuleMetadataFile = layout.buildDirectory.file('publications/mavenJava/module.json')

tasks.named('test') {
    dependsOn tasks.named('jar')
    dependsOn project(':routecontract-core').tasks.named('jar')
    dependsOn 'generatePomFileForMavenJavaPublication'
    dependsOn 'generateMetadataFileForMavenJavaPublication'
    doFirst {
        systemProperty 'routecontract.adapterJar', adapterJarFile.get().asFile
        systemProperty 'routecontract.coreJar', coreJarFile.get().asFile
        systemProperty 'routecontract.adapterPom', adapterPomFile.get().asFile
        systemProperty 'routecontract.adapterModuleMetadata', adapterModuleMetadataFile.get().asFile
    }
    useJUnitPlatform {
        excludeTags 'manifest-ci-failure-demo'
    }
}

tasks.register('manifestCiFailureDemo', Test) {
    group = 'verification'
    description = 'Intentionally fails on the committed manifest regression example'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'manifest-ci-failure-demo'
    }
    systemProperty 'routecontract.repositoryRoot', rootProject.projectDir.absolutePath
    testLogging {
        showStandardStreams = true
    }
}

jar {
    manifest {
        attributes('Automatic-Module-Name': 'io.github.ym0506.routecontract.shardingsphere55')
    }
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('NOTICE')) {
        into 'META-INF'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            // Maven cannot encode Gradle's exclusive hook-slot capability. The audited
            // consumer-owned Enforcer policy supplies that boundary for Maven consumers.
            suppressPomMetadataWarningsFor('apiElements')
            suppressPomMetadataWarningsFor('runtimeElements')
            pom {
                name = 'RouteContract for Apache ShardingSphere-JDBC 5.5.3'
                description = project.description
                url = 'https://github.com/ym0506/routecontract'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/ym0506/routecontract.git'
                    developerConnection = 'scm:git:ssh://git@github.com/ym0506/routecontract.git'
                    url = 'https://github.com/ym0506/routecontract'
                }
                developers {
                    developer {
                        id = 'ym0506'
                        name = 'ym0506'
                        email = 'atat9828@naver.com'
                        url = 'https://github.com/ym0506'
                    }
                }
            }
        }
    }
}
