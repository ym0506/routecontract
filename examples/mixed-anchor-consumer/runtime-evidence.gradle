// A standalone copied consumer resolves published-layout inputs; no product compilation.
tasks.register('prepareMixedAnchorRuntimeClasspath') {
    dependsOn 'testClasses', 'verifySelectedGraph'
    doLast {
        def artifacts = configurations.testRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
        layout.buildDirectory.file('mixed-anchor-runtime-classpath.json').get().asFile.text =
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                classes: sourceSets.test.output.classesDirs.files.collect { it.canonicalPath }.sort(),
                artifacts: artifacts.collect { artifact -> [
                    group: artifact.moduleVersion.id.group,
                    module: artifact.name,
                    version: artifact.moduleVersion.id.version,
                    path: artifact.file.canonicalPath,
                    sha256: java.security.MessageDigest.getInstance('SHA-256')
                        .digest(artifact.file.bytes).encodeHex().toString()
                ] }.sort { a, b -> "${a.group}:${a.module}" <=> "${b.group}:${b.module}" }
            ])) + '\n'
    }
}
