<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RouteContract approved baseline and candidate comparison</title>
  <desc id="desc">The approved equality query and the same-value BETWEEN candidate both return business row 201, while the observed physical JDBC execution attempts and observed data-source count grow from one to two. The RouteContract check fails with RCM201 and RCM202. The counts do not represent a full route, table set, commit count, or proof of business success.</desc>
  <defs>
    <style>
      .font { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #153957; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #41637d; }
      .card-title { font-size: 25px; font-weight: 700; fill: #153957; }
      .label { font-size: 18px; font-weight: 600; fill: #41637d; }
      .value { font-size: 23px; font-weight: 700; fill: #153957; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 20px; font-weight: 600; fill: #153957; }
      .metric { font-size: 18px; font-weight: 600; fill: #284c68; }
      .metric-value { font-size: 31px; font-weight: 800; fill: #153957; }
      .status { font-size: 19px; font-weight: 800; fill: #7b1e2b; }
      .status-code { font-size: 18px; font-weight: 700; fill: #5d2630; }
      .note { font-size: 16px; font-weight: 500; fill: #526b7e; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#153957" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#527fa1"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="#DAE9F7"/>
  <rect x="0" y="0" width="14" height="88" fill="#6e9fc2"/>
  <text class="font title" x="48" y="54">같은 업무 결과, 달라진 관측 실행 시도</text>
  <text class="font subtitle" x="1150" y="52" text-anchor="end">approved baseline → candidate</text>

  <text class="font subtitle" x="600" y="125" text-anchor="middle">business result: row 201 → row 201  ·  반환 결과는 동일</text>

  <g filter="url(#shadow)">
    <rect x="55" y="154" width="450" height="336" rx="18" fill="#ffffff" stroke="#8bb4d1" stroke-width="2"/>
    <path d="M73 154 H487 A18 18 0 0 1 505 172 V211 H55 V172 A18 18 0 0 1 73 154 Z" fill="#A5C9EB"/>
  </g>
  <text class="font card-title" x="82" y="192">기준선 (approved)</text>
  <rect x="82" y="232" width="396" height="58" rx="9" fill="#f5f9fc" stroke="#c7dbe9"/>
  <text class="font label" x="100" y="254">SQL predicate</text>
  <text class="mono" x="100" y="279">user_id = 3</text>
  <text class="font label" x="82" y="326">업무 반환 행</text>
  <text class="font value" x="478" y="326" text-anchor="end">row 201</text>
  <line x1="82" y1="345" x2="478" y2="345" stroke="#d5e3ed"/>
  <text class="font metric" x="82" y="377">observed physical JDBC</text>
  <text class="font metric" x="82" y="400">execution attempts</text>
  <text class="font metric-value" x="478" y="394" text-anchor="end">1</text>
  <text class="font metric" x="82" y="442">observed data-source count</text>
  <text class="font metric-value" x="478" y="449" text-anchor="end">1</text>

  <g filter="url(#shadow)">
    <rect x="695" y="154" width="450" height="336" rx="18" fill="#ffffff" stroke="#6e9fc2" stroke-width="3"/>
    <path d="M713 154 H1127 A18 18 0 0 1 1145 172 V211 H695 V172 A18 18 0 0 1 713 154 Z" fill="#DAE9F7"/>
  </g>
  <text class="font card-title" x="722" y="192">후보 (candidate)</text>
  <rect x="722" y="232" width="396" height="58" rx="9" fill="#f5f9fc" stroke="#c7dbe9"/>
  <text class="font label" x="740" y="254">SQL predicate</text>
  <text class="mono" x="740" y="279">user_id BETWEEN 3 AND 3</text>
  <text class="font label" x="722" y="326">업무 반환 행</text>
  <text class="font value" x="1118" y="326" text-anchor="end">row 201</text>
  <line x1="722" y1="345" x2="1118" y2="345" stroke="#d5e3ed"/>
  <text class="font metric" x="722" y="377">observed physical JDBC</text>
  <text class="font metric" x="722" y="400">execution attempts</text>
  <text class="font metric-value" x="1118" y="394" text-anchor="end">2</text>
  <text class="font metric" x="722" y="442">observed data-source count</text>
  <text class="font metric-value" x="1118" y="449" text-anchor="end">2</text>

  <line x1="535" y1="322" x2="665" y2="322" stroke="#527fa1" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="font label" x="600" y="292" text-anchor="middle">semantic diff</text>
  <text class="font value" x="600" y="362" text-anchor="middle">1 → 2</text>
  <text class="font note" x="600" y="388" text-anchor="middle">attempts / sources</text>

  <rect x="55" y="512" width="1090" height="98" rx="16" fill="#fff3f4" stroke="#d99aa3" stroke-width="2"/>
  <rect x="55" y="512" width="211" height="98" rx="16" fill="#f6d9dd"/>
  <path d="M250 512 H266 V610 H250 Z" fill="#f6d9dd"/>
  <text class="font status" x="160" y="550" text-anchor="middle">CONTRACT CHECK</text>
  <text class="font status" x="160" y="580" text-anchor="middle">FAILED</text>
  <text class="font status-code" x="296" y="551">RCM201  ATTEMPT_BUDGET_EXCEEDED</text>
  <text class="font status-code" x="296" y="583">RCM202  DATA_SOURCE_BUDGET_EXCEEDED</text>

  <text class="font note" x="600" y="646" text-anchor="middle">측정 경계: hook이 보고한 observed physical JDBC execution attempts · full route/table set, commit 수, business success를 뜻하지 않음</text>
</svg>
