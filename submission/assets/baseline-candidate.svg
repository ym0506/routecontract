<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RouteContract approved baseline and candidate structural comparison</title>
  <desc id="desc">The approved equality predicate and candidate same-value range predicate return the same one synthetic fixture row. SQLExecutionHook-reported attempts and reviewed alias counts both grow from one to two. The structural manifest diff fails the contract with RCM201 and RCM202. These counts are not a full route or table plan, transaction commit count, or proof of business success.</desc>
  <defs>
    <style>
      .font { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .title { font-size: 38px; font-weight: 800; fill: #153957; }
      .subtitle { font-size: 28px; font-weight: 700; fill: #41637d; }
      .card-title { font-size: 32px; font-weight: 800; fill: #153957; }
      .label { font-size: 28px; font-weight: 650; fill: #41637d; }
      .condition { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 30px; font-weight: 700; fill: #153957; }
      .metric-value { font-size: 58px; font-weight: 850; fill: #153957; }
      .diff-key { font-size: 32px; font-weight: 850; fill: #7b1e2b; }
      .boundary { font-size: 28px; font-weight: 700; fill: #153957; }
      .arrow { font-size: 64px; font-weight: 800; fill: #527fa1; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="92" fill="#DAE9F7"/>
  <rect x="0" y="0" width="14" height="92" fill="#6e9fc2"/>
  <text class="font title" x="46" y="58">같은 업무 결과, 달라진 관측 실행 시도</text>
  <text class="font subtitle" x="1154" y="56" text-anchor="end">approved baseline → candidate</text>

  <rect x="35" y="112" width="1130" height="62" rx="16" fill="#f2f7fb" stroke="#c7dbe9" stroke-width="3"/>
  <text class="font subtitle" x="600" y="153" text-anchor="middle">BUSINESS RESULT · same one synthetic fixture row</text>

  <rect x="35" y="195" width="505" height="270" rx="20" fill="#ffffff" stroke="#8bb4d1" stroke-width="3"/>
  <path d="M55 195 H520 A20 20 0 0 1 540 215 V263 H35 V215 A20 20 0 0 1 55 195 Z" fill="#A5C9EB"/>
  <text class="font card-title" x="287" y="240" text-anchor="middle">approved baseline</text>
  <text class="font label" x="287" y="304" text-anchor="middle">condition</text>
  <text class="font condition" x="287" y="343" text-anchor="middle">equality predicate</text>
  <line x1="287" y1="365" x2="287" y2="445" stroke="#d5e3ed" stroke-width="3"/>
  <text class="font label" x="160" y="397" text-anchor="middle">hook attempts</text>
  <text class="font metric-value" x="160" y="447" text-anchor="middle">1</text>
  <text class="font label" x="414" y="397" text-anchor="middle">reviewed aliases</text>
  <text class="font metric-value" x="414" y="447" text-anchor="middle">1</text>

  <text class="font arrow" x="600" y="360" text-anchor="middle">→</text>

  <rect x="660" y="195" width="505" height="270" rx="20" fill="#ffffff" stroke="#6e9fc2" stroke-width="4"/>
  <path d="M680 195 H1145 A20 20 0 0 1 1165 215 V263 H660 V215 A20 20 0 0 1 680 195 Z" fill="#DAE9F7"/>
  <text class="font card-title" x="912" y="240" text-anchor="middle">candidate</text>
  <text class="font label" x="912" y="304" text-anchor="middle">condition</text>
  <text class="font condition" x="912" y="343" text-anchor="middle">same-value range predicate</text>
  <line x1="912" y1="365" x2="912" y2="445" stroke="#d5e3ed" stroke-width="3"/>
  <text class="font label" x="785" y="397" text-anchor="middle">hook attempts</text>
  <text class="font metric-value" x="785" y="447" text-anchor="middle">2</text>
  <text class="font label" x="1039" y="397" text-anchor="middle">reviewed aliases</text>
  <text class="font metric-value" x="1039" y="447" text-anchor="middle">2</text>

  <rect x="35" y="488" width="1130" height="86" rx="18" fill="#fff3f4" stroke="#d99aa3" stroke-width="3"/>
  <text class="font label" x="225" y="538" text-anchor="middle">structural manifest diff</text>
  <text class="font diff-key" x="600" y="540" text-anchor="middle">1→2 attempts · 1→2 aliases</text>
  <text class="font diff-key" x="980" y="540" text-anchor="middle">RCM201 · RCM202</text>

  <rect x="35" y="590" width="1130" height="70" rx="16" fill="#DAE9F7" stroke="#8bb4d1" stroke-width="3"/>
  <text class="font boundary" x="600" y="620" text-anchor="middle">Hook-reported attempts only</text>
  <text class="font boundary" x="600" y="651" text-anchor="middle">not route/table plan, commit, or business success</text>
</svg>
