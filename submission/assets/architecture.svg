<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RouteContract two-input evidence-to-CI architecture</title>
  <desc id="desc">A named operation is observed through the ShardingSphere-JDBC 5.5.3 SQLExecutionHook as a value-minimized in-memory snapshot. A candidate canonical manifest and a versioned approved manifest are separate inputs to a deterministic structural manifest diff with stable RCM codes that gates CI. The snapshot and manifest omit raw SQL and bind values but are not anonymous. Supported scope is 5.5.3 normal return, caller non-interrupted, synchronous non-batch PreparedStatement.</desc>
  <defs>
    <style>
      .font { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .title { font-size: 38px; font-weight: 800; fill: #153957; }
      .subtitle { font-size: 28px; font-weight: 700; fill: #41637d; }
      .zone { font-size: 28px; font-weight: 800; fill: #41637d; }
      .key { font-size: 32px; font-weight: 800; fill: #153957; }
      .support { font-size: 28px; font-weight: 650; fill: #42637c; }
      .inverse-key { font-size: 32px; font-weight: 800; fill: #ffffff; }
      .inverse-support { font-size: 28px; font-weight: 700; fill: #ffffff; }
      .scope { font-size: 28px; font-weight: 750; fill: #153957; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#527fa1"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="92" fill="#DAE9F7"/>
  <rect x="0" y="0" width="14" height="92" fill="#6e9fc2"/>
  <text class="font title" x="46" y="58">관측 증거를 승인본과 비교해 CI에서 차단</text>
  <text class="font subtitle" x="1154" y="56" text-anchor="end">RouteContract · two-input gate</text>

  <rect x="35" y="128" width="360" height="397" rx="22" fill="#f7fbfe" stroke="#d0e2ef" stroke-width="3"/>
  <text class="font zone" x="215" y="170" text-anchor="middle">RUNTIME OBSERVATION</text>

  <rect x="65" y="185" width="300" height="90" rx="16" fill="#DAE9F7" stroke="#8bb4d1" stroke-width="3"/>
  <text class="font key" x="215" y="224" text-anchor="middle">capture</text>
  <text class="font support" x="215" y="261" text-anchor="middle">(operationId)</text>
  <line x1="215" y1="280" x2="215" y2="294" stroke="#527fa1" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="65" y="305" width="300" height="95" rx="16" fill="#A5C9EB" stroke="#6e9fc2" stroke-width="3"/>
  <text class="font support" x="215" y="330" text-anchor="middle">5.5.3</text>
  <text class="font support" x="215" y="361" text-anchor="middle">SQLExecution</text>
  <text class="font support" x="215" y="392" text-anchor="middle">Hook</text>
  <line x1="215" y1="405" x2="215" y2="414" stroke="#527fa1" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="65" y="425" width="300" height="80" rx="16" fill="#ffffff" stroke="#8bb4d1" stroke-width="3"/>
  <text class="font support" x="215" y="448" text-anchor="middle">value-minimized</text>
  <text class="font support" x="215" y="475" text-anchor="middle">in-memory</text>
  <text class="font support" x="215" y="502" text-anchor="middle">snapshot</text>

  <rect x="435" y="128" width="320" height="397" rx="22" fill="#fbfdff" stroke="#d0e2ef" stroke-width="3"/>
  <text class="font zone" x="595" y="170" text-anchor="middle">COMPARISON INPUTS</text>

  <rect x="465" y="185" width="260" height="150" rx="18" fill="#DAE9F7" stroke="#8bb4d1" stroke-width="3"/>
  <text class="font support" x="595" y="225" text-anchor="middle">candidate</text>
  <text class="font key" x="595" y="274" text-anchor="middle">canonical</text>
  <text class="font key" x="595" y="316" text-anchor="middle">manifest</text>

  <rect x="465" y="365" width="260" height="150" rx="18" fill="#ffffff" stroke="#6e9fc2" stroke-width="4"/>
  <text class="font support" x="595" y="405" text-anchor="middle">versioned</text>
  <text class="font key" x="595" y="454" text-anchor="middle">approved</text>
  <text class="font key" x="595" y="496" text-anchor="middle">manifest</text>

  <path d="M365 465 H420 V260 H453" fill="none" stroke="#527fa1" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="795" y="190" width="280" height="285" rx="22" fill="#A5C9EB" stroke="#6e9fc2" stroke-width="3"/>
  <text class="font support" x="935" y="252" text-anchor="middle">deterministic</text>
  <text class="font support" x="935" y="301" text-anchor="middle">structural</text>
  <text class="font key" x="935" y="351" text-anchor="middle">manifest diff</text>
  <text class="font support" x="935" y="408" text-anchor="middle">stable RCM codes</text>

  <line x1="725" y1="260" x2="783" y2="260" stroke="#527fa1" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M725 440 H770 V430 H783" fill="none" stroke="#527fa1" stroke-width="5" marker-end="url(#arrow)"/>

  <line x1="1083" y1="335" x2="1098" y2="335" stroke="#527fa1" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1110" y="266" width="76" height="138" rx="18" fill="#153957"/>
  <text class="font inverse-key" x="1148" y="326" text-anchor="middle">CI</text>
  <text class="font inverse-support" x="1148" y="371" text-anchor="middle">gate</text>

  <rect x="35" y="545" width="1150" height="115" rx="20" fill="#DAE9F7" stroke="#8bb4d1" stroke-width="3"/>
  <text class="font scope" x="610" y="581" text-anchor="middle">SUPPORTED · 5.5.3 normal return · caller non-interrupted</text>
  <text class="font scope" x="610" y="617" text-anchor="middle">synchronous non-batch PreparedStatement</text>
  <text class="font scope" x="610" y="649" text-anchor="middle">no raw SQL / bind values · value-minimized does not mean anonymized</text>
</svg>
